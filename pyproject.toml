[project]
name = "touchstone"
version = "0.1.0"
description = "Queue-aware market-making simulator built on recorded Coinbase level-2 data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "polars>=2.1,<3",
    "websockets>=17.4,<18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "shellcheck-py>=0.10",
    "touchstone-engine",
    "numpy>=2",
    "sortedcontainers>=2.4",
    "matplotlib>=3.9",
]

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
touchstone-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
